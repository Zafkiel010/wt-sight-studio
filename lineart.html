<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>线稿导出器 · Lineart Exporter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-1: #0f0f1a;
    --bg-2: #1a1a2e;
    --bg-3: #16213e;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.15);
    --text: #e8e8f0;
    --text-dim: #9090a8;
    --text-faint: #656580;
    --accent: #818cf8;
    --accent-glow: rgba(129, 140, 248, 0.35);
    --accent-2: #c084fc;
    --success: #34d399;
    --error: #f87171;
    --warning: #fbbf24;
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 6px;
  }
  html { font-size: 14px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg-1);
    color: var(--text);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 10% 0%, rgba(129,140,248,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 100% 100%, rgba(192,132,252,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(52,211,153,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ============ Layout ============ */
  .app {
    position: relative;
    z-index: 1;
    max-width: 880px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* ============ Header ============ */
  .header { text-align: center; margin-bottom: 36px; }
  .logo {
    display: inline-flex; align-items: center; gap: 12px;
    margin-bottom: 10px;
  }
  .logo-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 20px var(--accent-glow);
  }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  .tagline { font-size: 13px; color: var(--text-dim); margin-top: 6px; }

  /* ============ Card ============ */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    margin-bottom: 16px;
  }

  /* ============ Drop Zone ============ */
  .drop {
    position: relative;
    border: 2px dashed var(--border-strong);
    border-radius: var(--radius-lg);
    padding: 48px 20px;
    text-align: center;
    cursor: pointer;
    transition: all .25s cubic-bezier(.4,0,.2,1);
    background: rgba(255,255,255,0.01);
  }
  .drop:hover {
    border-color: var(--accent);
    background: rgba(129,140,248,0.04);
  }
  .drop.drag {
    border-color: var(--accent);
    background: rgba(129,140,248,0.08);
    transform: scale(1.01);
  }
  .drop input[type="file"] {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; z-index: 2;
  }
  .drop-emoji { font-size: 32px; margin-bottom: 8px; display: block; }
  .drop-text { font-size: 15px; color: var(--text); margin-bottom: 4px; }
  .drop-hint { font-size: 12px; color: var(--text-faint); }

  /* ============ Previews ============ */
  .previews {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  .preview {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    min-height: 260px;
    display: flex; flex-direction: column;
  }
  .preview-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px;
    font-size: 11px;
    color: var(--text-faint);
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
  }
  .preview-header .tag {
    padding: 2px 8px; border-radius: 10px;
    background: rgba(255,255,255,0.06);
    font-size: 10px; color: var(--text-dim);
  }
  .preview-canvas-wrap {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 8px;
    position: relative;
  }
  .preview canvas, .preview img {
    max-width: 100%; max-height: 320px;
    object-fit: contain;
  }
  .preview.transparent canvas {
    background-image:
      linear-gradient(45deg, rgba(255,255,255,0.04) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(255,255,255,0.04) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.04) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.04) 75%);
    background-size: 14px 14px;
    background-position: 0 0, 0 7px, 7px -7px, -7px 0px;
    background-color: #0a0a14;
  }
  .preview .placeholder {
    color: var(--text-faint);
    font-size: 13px;
  }

  /* ============ Controls ============ */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 20px;
  }
  .ctrl {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
  }
  .ctrl-label { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }

  /* Color control */
  .color-row { display: flex; gap: 8px; align-items: center; }
  input[type="color"] {
    width: 40px; height: 36px; border: none; border-radius: 8px;
    cursor: pointer; background: transparent; padding: 0;
    border: 2px solid var(--border-strong);
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
  input[type="text"].hex {
    flex: 1;
    padding: 8px 12px; border-radius: 8px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-family: "SF Mono", Consolas, monospace;
    font-size: 13px;
    text-transform: uppercase;
    outline: none;
    transition: border-color .15s;
  }
  input[type="text"].hex:focus { border-color: var(--accent); }
  .preset-colors { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .preset-colors button {
    width: 24px; height: 24px; border-radius: 6px;
    border: 2px solid var(--border-strong);
    cursor: pointer; padding: 0;
    transition: transform .15s, border-color .15s;
  }
  .preset-colors button:hover { transform: scale(1.15); border-color: var(--accent); }

  /* Slider */
  .slider-row { display: flex; align-items: center; gap: 12px; }
  input[type="range"] {
    flex: 1;
    height: 4px; border-radius: 2px;
    background: var(--border-strong);
    -webkit-appearance: none; appearance: none;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 2px 8px var(--accent-glow);
    transition: transform .15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  .slider-val {
    min-width: 40px;
    text-align: center;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12px;
    color: var(--accent);
    padding: 2px 8px;
    background: rgba(129,140,248,0.12);
    border-radius: 6px;
  }

  /* Select */
  select.ctrl-select {
    width: 100%;
    padding: 9px 12px; border-radius: 8px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }
  select.ctrl-select:focus { border-color: var(--accent); }

  /* ============ Buttons ============ */
  .action-bar {
    display: flex; gap: 10px; margin-top: 18px;
  }
  button.btn {
    flex: 1;
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s cubic-bezier(.4,0,.2,1);
    font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px var(--accent-glow);
  }
  .btn-primary:active:not(:disabled) { transform: translateY(0); }
  .btn-secondary {
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border: 1px solid var(--border-strong);
  }
  .btn-secondary:hover:not(:disabled) {
    background: rgba(255,255,255,0.10);
    border-color: var(--border-strong);
  }
  .btn-download {
    background: linear-gradient(135deg, #059669, #10b981);
    color: white;
    box-shadow: 0 4px 16px rgba(16,185,129,0.3);
  }
  .btn-download:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(16,185,129,0.4);
  }
  button.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ============ Status ============ */
  .status-wrap { margin-top: 14px; }
  .status {
    display: none;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    font-size: 13px;
    align-items: center;
    gap: 10px;
  }
  .status.busy { background: rgba(129,140,248,0.12); color: var(--accent); border: 1px solid rgba(129,140,248,0.25); display: flex; }
  .status.ok   { background: rgba(52,211,153,0.10); color: var(--success); border: 1px solid rgba(52,211,153,0.25); display: flex; }
  .status.err  { background: rgba(248,113,113,0.12); color: var(--error); border: 1px solid rgba(248,113,113,0.25); display: flex; }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid currentColor; border-top-color: transparent;
    animation: spin .7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ Responsive ============ */
  @media (max-width: 640px) {
    .previews { grid-template-columns: 1fr; }
    .controls { grid-template-columns: 1fr; }
    .action-bar { flex-wrap: wrap; }
    .action-bar .btn { flex: 1 1 40%; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">✏️</div>
    </div>
    <h1>线稿导出器</h1>
    <p class="tagline">AI 自动描边 · 透明背景 PNG · 自定义描边颜色</p>
  </div>

  <!-- Upload -->
  <div class="card" style="padding:0;">
    <label class="drop" id="drop">
      <span class="drop-emoji">📷</span>
      <span class="drop-text">点击选择图片 或 拖拽到这里</span>
      <span class="drop-hint">支持 PNG / JPG / WEBP · 建议人物立绘或头像</span>
      <input type="file" id="file" accept="image/*">
    </label>
  </div>

  <!-- Previews -->
  <div class="previews">
    <div class="preview">
      <div class="preview-header">
        <span>原图</span>
        <span class="tag" id="srcInfo">-</span>
      </div>
      <div class="preview-canvas-wrap">
        <canvas id="srcCanvas"></canvas>
      </div>
    </div>
    <div class="preview transparent">
      <div class="preview-header">
        <span>线稿预览</span>
        <span class="tag" id="outInfo">-</span>
      </div>
      <div class="preview-canvas-wrap">
        <canvas id="outCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="ctrl">
      <div class="ctrl-label">描边颜色</div>
      <div class="color-row">
        <input type="color" id="colorPicker" value="#ffffff">
        <input type="text" id="colorHex" class="hex" value="#FFFFFF" maxlength="7">
      </div>
      <div class="preset-colors">
        <button style="background:#ffffff" title="白" data-c="#ffffff"></button>
        <button style="background:#000000" title="黑" data-c="#000000"></button>
        <button style="background:#ff4466" title="红" data-c="#ff4466"></button>
        <button style="background:#44ccff" title="蓝" data-c="#44ccff"></button>
        <button style="background:#88ff44" title="绿" data-c="#88ff44"></button>
        <button style="background:#ffcc44" title="黄" data-c="#ffcc44"></button>
        <button style="background:#cc66ff" title="紫" data-c="#cc66ff"></button>
      </div>
    </div>

    <div class="ctrl">
      <div class="ctrl-label">最大边</div>
      <select id="skSize" class="ctrl-select">
        <option value="0">原图大小</option>
        <option value="1024">1024px</option>
        <option value="2048" selected>2048px（推荐）</option>
        <option value="3072">3072px</option>
        <option value="4096">4096px（小图放大出细线条）</option>
      </select>
    </div>

    <div class="ctrl" style="grid-column: 1 / -1;">
      <div class="ctrl-label">线稿强度 <span id="threshLabel" style="color:var(--text-faint);font-size:11px;">10%</span></div>
      <div class="slider-row">
        <input type="range" id="thresh" min="0" max="30" value="10" title="线条保留阈值（越小线条越多，越大只保最粗主线）">
        <span class="slider-val" id="threshVal">10%</span>
      </div>
    </div>
  </div>

  <!-- Action -->
  <div class="action-bar">
    <button class="btn btn-primary" id="goBtn" disabled>
      ✨ 生成线稿
    </button>
    <button class="btn btn-secondary" id="recolorBtn" disabled>
      🎨 只改颜色
    </button>
    <button class="btn btn-download" id="dlBtn" disabled>
      💾 下载 PNG
    </button>
  </div>

  <!-- Status -->
  <div class="status-wrap">
    <div class="status" id="status">
      <span class="spinner"></span>
      <span id="statusText"></span>
    </div>
  </div>
</div>

<script>
// ============ onnxruntime 加载（动态 <script>，挂 window.ort，UMD） ============
const ORT_CDN_BASES = [
  'ort/',
  'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/',
  'https://unpkg.com/onnxruntime-web@1.19.2/dist/'
];
let ortLoadPromise = null;

function loadOrt() {
  if (window.ort) return Promise.resolve(window.ort);
  if (ortLoadPromise) return ortLoadPromise;
  ortLoadPromise = (async () => {
    let lastErr = null;
    for (const base of ORT_CDN_BASES) {
      try {
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = base + 'ort.min.js';
          s.async = true;
          const timer = setTimeout(() => {
            s.onerror = null; s.onload = null;
            reject(new Error('加载超时'));
          }, 15000);
          s.onload = () => { clearTimeout(timer); resolve(); };
          s.onerror = () => { clearTimeout(timer); reject(new Error('HTTP 加载失败')); };
          document.head.appendChild(s);
        });
        await new Promise(r => setTimeout(r, 50));
        if (window.ort) {
          window.ort.env.wasm.wasmPaths = new URL(base, location.href).href;
          window.ort.env.wasm.simd = true;
          if (self.crossOriginIsolated && (navigator.hardwareConcurrency || 1) > 2) {
            window.ort.env.wasm.numThreads = Math.min(4, navigator.hardwareConcurrency - 1);
          } else {
            window.ort.env.wasm.numThreads = 1;
          }
          console.log('ort loaded from', base, '→ wasmPaths=' + ort.env.wasm.wasmPaths, 'threads=' + ort.env.wasm.numThreads);
          return window.ort;
        }
        throw new Error('window.ort 未定义（UMD 可能初始化失败）');
      } catch (e) {
        lastErr = e;
        console.warn('ORT 源失败 (' + base + '):', e.message);
        document.querySelectorAll('script[src*="onnxruntime"], script[src*="ort.min"]').forEach(s => s.remove());
      }
    }
    ortLoadPromise = null;
    throw new Error('onnxruntime-web 加载失败：' + (lastErr?.message || '未知') + '（请用本地服务器 serve.ps1 访问）');
  })();
  return ortLoadPromise;
}

// ============ 模型加载 ============
const MODEL_SOURCES = [
  (name) => `https://cdn.jsdelivr.net/gh/Zafkiel010/wt-sight-studio@main/model/${name}.onnx`,
  (name) => `https://raw.githubusercontent.com/Zafkiel010/wt-sight-studio/main/model/${name}.onnx`,
  (name) => `model/${name}.onnx`
];

async function fetchModelWithProgress(name) {
  let lastProgress = 0;
  const tryFetch = async (url) => {
    setStatus('加载模型 ' + name + ' … (' + url.split('/')[2] + ')', 'busy');
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const total = +resp.headers.get('Content-Length');
    if (!total) return resp.arrayBuffer();
    const reader = resp.body.getReader();
    const chunks = []; let received = 0;
    const stallTimer = setInterval(() => {
      if (received === lastProgress) { clearInterval(stallTimer); throw new Error('15秒无进度'); }
      lastProgress = received;
    }, 15000);
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      chunks.push(value); received += value.length;
      const pct = Math.round(received / total * 100);
      if (pct - lastProgress >= 5) {
        lastProgress = pct;
        setStatus('加载模型 ' + name + ' … ' + pct + '% (' + Math.round(received/1024/1024*10)/10 + '/' + Math.round(total/1024/1024*10)/10 + ' MB)', 'busy');
      }
    }
    clearInterval(stallTimer);
    return new Blob(chunks).arrayBuffer();
  };
  let lastErr = null;
  for (const mkUrl of MODEL_SOURCES) {
    try { return await tryFetch(mkUrl(name)); } catch (e) { lastErr = e; console.warn('模型源失败:', e.message); }
  }
  throw new Error('模型加载失败：' + lastErr.message + '（国内网络请用本地服务器 serve.ps1）');
}

// ============ DOM ============
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const srcCanvas = document.getElementById('srcCanvas');
const outCanvas = document.getElementById('outCanvas');
const srcInfo = document.getElementById('srcInfo');
const outInfo = document.getElementById('outInfo');
const colorPicker = document.getElementById('colorPicker');
const colorHex = document.getElementById('colorHex');
const thresh = document.getElementById('thresh');
const threshLabel = document.getElementById('threshLabel');
const threshVal = document.getElementById('threshVal');
const skSize = document.getElementById('skSize');
const goBtn = document.getElementById('goBtn');
const recolorBtn = document.getElementById('recolorBtn');
const dlBtn = document.getElementById('dlBtn');
const status = document.getElementById('status');
const statusText = document.getElementById('statusText');

let img = null;
let rawSketch = null;
let sketchHW = null;
let currentColor = '#FFFFFF';

// ============ 状态 ============
function setStatus(msg, type = 'busy') {
  status.style.display = 'flex';
  status.className = 'status ' + type;
  statusText.textContent = msg;
}
function clearStatus() { status.style.display = 'none'; }

// ============ 文件上传 ============
drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('drag');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(f) {
  const im = new Image();
  im.onload = () => {
    img = im;
    srcInfo.textContent = im.width + '×' + im.height;
    srcCanvas.width = im.width; srcCanvas.height = im.height;
    srcCanvas.getContext('2d').drawImage(im, 0, 0);
    goBtn.disabled = false;
    recolorBtn.disabled = true;
    dlBtn.disabled = true;
    clearStatus();
    outCanvas.width = outCanvas.height = 1;
    outInfo.textContent = '-';
  };
  im.src = URL.createObjectURL(f);
}

// ============ 颜色控制 ============
colorPicker.addEventListener('input', () => {
  currentColor = colorPicker.value;
  colorHex.value = currentColor.toUpperCase();
  if (rawSketch) renderLineart();
});
colorHex.addEventListener('change', () => {
  let v = colorHex.value.trim();
  if (!v.startsWith('#')) v = '#' + v;
  if (/^#[0-9a-fA-F]{6}$/.test(v)) {
    currentColor = v;
    colorPicker.value = v;
    if (rawSketch) renderLineart();
  } else {
    colorHex.value = currentColor.toUpperCase();
  }
});
document.querySelectorAll('.preset-colors button').forEach(b => {
  b.addEventListener('click', () => {
    currentColor = b.dataset.c;
    colorPicker.value = currentColor;
    colorHex.value = currentColor.toUpperCase();
    if (rawSketch) renderLineart();
  });
});

// ============ 强度滑块 ============
thresh.addEventListener('input', () => {
  threshLabel.textContent = thresh.value + '%';
  threshVal.textContent = thresh.value + '%';
  if (rawSketch) renderLineart();
});

// ============ 主按钮 ============
goBtn.addEventListener('click', generateLineart);
recolorBtn.addEventListener('click', () => { if (rawSketch) renderLineart(); });
dlBtn.addEventListener('click', () => {
  outCanvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    a.download = 'lineart_' + ts + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }, 'image/png');
});

// ============ 生成线稿 ============
async function generateLineart() {
  if (!img) return;
  goBtn.disabled = true;
  try {
    const size = parseInt(skSize.value);
    let W = img.width, H = img.height;
    const maxSide = size > 0 ? size : Math.max(W, H);
    const k = maxSide / Math.max(W, H);
    W = Math.max(8, Math.round(W * k / 8) * 8);
    H = Math.max(8, Math.round(H * k / 8) * 8);

    setStatus('预处理 ' + W + '×' + H + ' …', 'busy');
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    g.drawImage(img, 0, 0, W, H);
    const id = g.getImageData(0, 0, W, H);
    const d = id.data, px = W * H;
    const rgb = new Float32Array(3 * px);
    for (let i = 0, p = 0; p < px; p++, i += 4) {
      rgb[p] = d[i] / 255;
      rgb[p + px] = d[i + 1] / 255;
      rgb[p + 2 * px] = d[i + 2] / 255;
    }

    setStatus('加载 AI 模型（首次约需下载 17MB）…', 'busy');
    const ortMod = await loadOrt();
    const bytes = await fetchModelWithProgress('line-drawings');
    const sess = await ortMod.InferenceSession.create(bytes, {
      executionProviders: ['wasm'], graphOptimizationLevel: 'all'
    });

    setStatus('AI 推理中（' + W + '×' + H + '）…', 'busy');
    await new Promise(r => setTimeout(r, 30));
    const feeds = {}; feeds[sess.inputNames[0]] = new ortMod.Tensor('float32', rgb, [1, 3, H, W]);
    const out = await sess.run(feeds);
    const tn = sess.outputNames[0];
    const dims = out[tn].dims;
    const arr = out[tn].data;
    const OH = dims[2], OW = dims[3];

    rawSketch = new Float32Array(arr.length);
    for (let i = 0; i < arr.length; i++) rawSketch[i] = Math.max(0, Math.min(1, arr[i]));
    sketchHW = { H: OH, W: OW };

    renderLineart();
    setStatus('完成！' + OW + '×' + OH, 'ok');
    recolorBtn.disabled = false;
    dlBtn.disabled = false;
  } catch (e) {
    console.error(e);
    setStatus(e.message || e, 'err');
  } finally {
    goBtn.disabled = false;
  }
}

// ============ 渲染（透明背景 + 可改颜色） ============
function renderLineart() {
  if (!rawSketch || !sketchHW) return;
  const { H, W } = sketchHW;
  const hex = currentColor.replace('#', '');
  const R = parseInt(hex.substring(0, 2), 16);
  const G = parseInt(hex.substring(2, 4), 16);
  const B = parseInt(hex.substring(4, 6), 16);
  const threshPct = parseInt(thresh.value);
  const t = threshPct / 100;

  outCanvas.width = W;
  outCanvas.height = H;
  const g = outCanvas.getContext('2d');
  const od = g.createImageData(W, H);
  const dd = od.data;

  for (let p = 0, i = 0; p < rawSketch.length; p++, i += 4) {
    const v = rawSketch[p];
    let alpha = 0;
    if (v > t) alpha = Math.round(((v - t) / (1 - t)) * 255);
    if (alpha > 255) alpha = 255;
    dd[i]     = R;
    dd[i + 1] = G;
    dd[i + 2] = B;
    dd[i + 3] = alpha;
  }
  g.putImageData(od, 0, 0);
  outInfo.textContent = W + '×' + H;
}
